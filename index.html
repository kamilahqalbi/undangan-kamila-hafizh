<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4b1016">
<title>Kamila & Hafizh — You've Got Mail</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eee8e0;color:#2e2422;font-family:Georgia,serif}
.cover{min-height:100svh;display:flex;align-items:center;justify-content:center;background:#d8d6d0;padding:0;position:relative}
.cover img{display:block;width:100%;height:100svh;object-fit:cover;object-position:center}
.open-hit{position:absolute;left:13%;right:13%;top:60%;height:13%;border:0;background:transparent;cursor:pointer}
main{display:none;background:#4b1016;min-height:100vh}
.inside-wrap{max-width:900px;margin:0 auto;background:#4b1016}
.inside-wrap img{display:block;width:100%;height:auto}
.personal{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:5;padding:9px 14px;border-radius:30px;background:#fffaf0e8;color:#4b1016;font:12px Arial,sans-serif;box-shadow:0 3px 16px #0002;display:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music{position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:1px solid #d6c3a4;background:#fffaf0;color:#4b1016;font-size:20px;z-index:10;box-shadow:0 4px 16px #0003;cursor:pointer}
.note{background:#fffaf0;color:#4b1016;text-align:center;padding:12px;font:12px Arial,sans-serif}
@media(min-width:700px){.cover img{object-fit:contain;background:#d8d6d0}.inside-wrap{max-width:520px}}
</style>
</head>
<body>
<section class="cover" id="cover">
  <img src="assets/inside.png" alt="Cover undangan Kamila dan Hafizh">
  <button class="open-hit" id="open" aria-label="Open the invitation"></button>
</section>
<main id="main">
  <div class="personal" id="personal"></div>
  <div class="inside-wrap"><img src="assets/cover.jpeg" alt="Isi undangan Kamila dan Hafizh"></div>
  <div class="note">Kamila &amp; Hafizh · Thank you for being part of our day</div>
</main>
<button class="music" id="music" aria-label="Putar musik" title="Putar musik">♫</button>
<div id="yt" style="position:fixed;left:-1000px;top:-1000px"></div>
<script>
const guest=new URLSearchParams(location.search).get('to');
if(guest){const el=document.getElementById('personal');el.textContent='For: '+guest;el.style.display='block';}
document.getElementById('open').addEventListener('click',()=>{
 document.getElementById('cover').style.display='none';
 document.getElementById('main').style.display='block';
 window.scrollTo(0,0);
});
let player=null,playing=false;
window.onYouTubeIframeAPIReady=function(){
 player=new YT.Player('yt',{height:'1',width:'1',videoId:'joKMsvaR9gQ',playerVars:{start:32,playsinline:1,loop:1,playlist:'joKMsvaR9gQ'}});
};
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
document.getElementById('music').addEventListener('click',()=>{
 if(!player||!player.playVideo){alert('Musik sedang dimuat. Tekan lagi sebentar.');return;}
 if(playing){player.pauseVideo();playing=false;document.getElementById('music').textContent='♫';}
 else{player.playVideo();playing=true;document.getElementById('music').textContent='Ⅱ';}
});
</script>
</body></html>
