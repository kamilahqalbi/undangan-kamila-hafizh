
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wedding of Kamila & Hafizh</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #eeeae5;
  font-family: Georgia, serif;
}

.cover {
  max-width: 500px;
  width: 100%;
  margin: auto;
  position: relative;
}

.cover img {
  width: 100%;
  display: block;
}

.guest {
  position: absolute;
  top: 38%;
  width: 100%;
  text-align: center;
  color: #75615c;
  font-size: 17px;
  font-style: italic;
  padding: 0 15px;
}

.open-button {
  position: absolute;
  top: 69%;
  left: 10%;
  width: 80%;
  height: 8%;
  border: 0;
  background: transparent;
  cursor: pointer;
}

#pages {
  display: none;
  max-width: 500px;
  margin: auto;
}

#pages img {
  display: block;
  width: 100%;
  height: auto;
}

#musicButton {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #806b66;
  color: white;
  font-size: 20px;
  z-index: 20;
}

/* YouTube player */
#youtube-player {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -220px;
  top: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- COVER -->
<section class="cover" id="cover">

  <img src="cover.png" alt="Kamila & Hafizh">

  <div class="guest" id="guest">
    Tamu Undangan
  </div>

  <button
    class="open-button"
    onclick="openInvite()"
    aria-label="Open Invitation">
  </button>

</section>

<!-- ISI UNDANGAN -->
<section id="pages">
  <img src="page-1.png" alt="Halaman undangan">
</section>

<!-- YOUTUBE -->
<div id="youtube-player"></div>

<button id="musicButton" onclick="toggleMusic()">
  ♫
</button>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const params = new URLSearchParams(location.search);

document.getElementById("guest").textContent =
  params.get("to") || "Tamu Undangan";

let player;
let playerReady = false;
let invitationOpened = false;

function onYouTubeIframeAPIReady() {

  player = new YT.Player("youtube-player", {
    width: "200",
    height: "200",
    videoId: "joKMsvaR9gQ",

    playerVars: {
      autoplay: 0,
      controls: 0,
      start: 32,
      playsinline: 1,
      loop: 1,
      playlist: "joKMsvaR9gQ"
    },

    events: {
      onReady: function() {
        playerReady = true;

        if (invitationOpened) {
          playMusic();
        }
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          player.seekTo(32, true);
          player.playVideo();
        }
      }
    }
  });
}

function playMusic() {
  if (!playerReady) return;

  player.seekTo(32, true);
  player.playVideo();

  document.getElementById("musicButton").textContent = "♫";
}

function openInvite() {
  invitationOpened = true;

  document.getElementById("cover").style.display = "none";
  document.getElementById("pages").style.display = "block";
  document.getElementById("musicButton").style.display = "block";

  window.scrollTo(0, 0);

  playMusic();
}

function toggleMusic() {
  if (!playerReady) return;

  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
    document.getElementById("musicButton").textContent = "▶";
  } else {
    if (player.getPlayerState() === YT.PlayerState.ENDED) {
      player.seekTo(32, true);
    }

    player.playVideo();
    document.getElementById("musicButton").textContent = "♫";
  }
}
</script>

</body>
</html>
