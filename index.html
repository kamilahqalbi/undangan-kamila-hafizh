
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eeeae5">
<title>The Wedding of Kamila & Hafizh</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: #eeeae5;
  font-family: Georgia, serif;
}

.cover, #pages {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
}

.guest {
  position: absolute;
  top: 51%;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(14px, 4vw, 19px);
  font-style: italic;
  color: #75615c;
  pointer-events: none;
}

.open-button {
  position: absolute;
  top: 63%;
  left: 10%;
  width: 80%;
  height: 9%;
  border: none;
  background: transparent;
  cursor: pointer;
}

#pages { display: none; }

#musicButton {
  display: none;
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #806b66;
  color: white;
  font-size: 21px;
  z-index: 100;
}

#youtube-player {
  position: fixed;
  left: -9999px;
  top: 0;
}
</style>
</head>

<body>

<section class="cover" id="cover">
  <canvas id="coverCanvas"></canvas>
  <div class="guest" id="guest">Tamu Undangan</div>
  <button class="open-button"
    onclick="openInvitation()"
    aria-label="Open the Invitation"></button>
</section>

<section id="pages">
  <canvas id="pageCanvas"></canvas>
</section>

<div id="youtube-player"></div>

<button id="musicButton" onclick="toggleMusic()">♫</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
(async function () {
  const pdfjs = window.pdfjsLib;

  pdfjs.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  async function renderPDF(filename, canvasId) {
    const pdf = await pdfjs.getDocument(filename).promise;
    const page = await pdf.getPage(1);
    const canvas = document.getElementById(canvasId);
    const context = canvas.getContext("2d");

    const original = page.getViewport({ scale: 1 });
    const width = document.querySelector(".cover").clientWidth;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const scale = width / original.width * ratio;
    const viewport = page.getViewport({ scale });

    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;
  }

  try {
    await renderPDF("cover.png.pdf", "coverCanvas");
  } catch (error) {
    console.error(error);
    alert("Cover PDF gagal dimuat.");
  }

  window.renderInvitationPage = renderPDF;
})();

const params = new URLSearchParams(location.search);
document.getElementById("guest").textContent =
  params.get("to") || "Tamu Undangan";

let player;
let playerReady = false;
let invitationOpened = false;
let playing = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player("youtube-player", {
    width: "200",
    height: "200",
    videoId: "joKMsvaR9gQ",
    playerVars: {
      playsinline: 1,
      controls: 0,
      start: 32,
      loop: 1,
      playlist: "joKMsvaR9gQ"
    },
    events: {
      onReady: function () {
        playerReady = true;
        if (invitationOpened) startMusic();
      },
      onStateChange: function (event) {
        if (event.data === YT.PlayerState.ENDED) {
          player.seekTo(32, true);
          player.playVideo();
        }
      }
    }
  });
}

async function openInvitation() {
  try {
    await window.renderInvitationPage(
      "page-1.png.pdf", "pageCanvas"
    );

    document.getElementById("cover").style.display = "none";
    document.getElementById("pages").style.display = "block";
    document.getElementById("musicButton").style.display = "block";

    invitationOpened = true;
    window.scrollTo(0, 0);

    if (playerReady) startMusic();
  } catch (error) {
    console.error(error);
    alert("Halaman undangan gagal dimuat.");
  }
}

function startMusic() {
  if (!playerReady) return;
  player.seekTo(32, true);
  player.playVideo();
  playing = true;
  document.getElementById("musicButton").textContent = "♫";
}

function toggleMusic() {
  if (!playerReady) return;

  if (playing) {
    player.pauseVideo();
    playing = false;
    document.getElementById("musicButton").textContent = "▶";
  } else {
    player.playVideo();
    playing = true;
    document.getElementById("musicButton").textContent = "♫";
  }
}
</script>

</body>
</html>
