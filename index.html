
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eeeae5">

<title>The Wedding of Kamila & Hafizh</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #eeeae5;
  font-family: Georgia, serif;
}

.cover {
  width: 100%;
  height: 100svh;
  position: relative;
  overflow: hidden;
  background: #eeeae5;
}

.cover iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

.guest {
  position: absolute;
  top: 38%;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(14px, 4vw, 19px);
  font-style: italic;
  color: #75615c;
  padding: 0 15px;
  pointer-events: none;
}

.open-button {
  position: absolute;
  top: 69%;
  left: 10%;
  width: 80%;
  height: 8%;
  border: none;
  background: transparent;
  cursor: pointer;
}

#pages {
  display: none;
  width: 100%;
  max-width: 600px;
  margin: auto;
}

#pages iframe {
  display: block;
  width: 100%;
  height: 100svh;
  border: none;
  background: #fff;
}

#musicButton {
  display: none;
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #806b66;
  color: white;
  font-size: 21px;
  z-index: 100;
  cursor: pointer;
}

#youtube-player {
  position: fixed;
  left: -250px;
  top: 0;
  width: 200px;
  height: 200px;
}
</style>
</head>

<body>

<!-- HALAMAN PEMBUKA -->
<section class="cover" id="cover">

  <iframe
    src="cover.png.pdf#toolbar=0&navpanes=0&view=Fit"
    title="Cover undangan Kamila dan Hafizh">
  </iframe>

  <div class="guest" id="guest">
    Tamu Undangan
  </div>

  <button
    class="open-button"
    onclick="openInvitation()"
    aria-label="Open the Invitation">
  </button>

</section>

<!-- ISI UNDANGAN -->
<section id="pages">

  <iframe
    src="page-1.png.pdf#toolbar=0&navpanes=0&view=Fit"
    title="Isi undangan Kamila dan Hafizh">
  </iframe>

</section>

<!-- PEMUTAR MUSIK YOUTUBE -->
<div id="youtube-player"></div>

<button
  id="musicButton"
  onclick="toggleMusic()"
  aria-label="Play or pause music">
  ♫
</button>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

// NAMA TAMU OTOMATIS
const params = new URLSearchParams(window.location.search);

const guestName = params.get("to") || "Tamu Undangan";

document.getElementById("guest").textContent = guestName;


// YOUTUBE PLAYER
let player;
let playerReady = false;
let invitationOpened = false;

function onYouTubeIframeAPIReady() {

  player = new YT.Player("youtube-player", {

    width: "200",
    height: "200",

    videoId: "joKMsvaR9gQ",

    playerVars: {
      autoplay: 0,
      controls: 0,
      start: 32,
      playsinline: 1,
      loop: 1,
      playlist: "joKMsvaR9gQ"
    },

    events: {

      onReady: function() {
        playerReady = true;

        if (invitationOpened) {
          startMusic();
        }
      },

      onStateChange: function(event) {

        if (event.data === YT.PlayerState.ENDED) {
          player.seekTo(32, true);
          player.playVideo();
        }

      }

    }

  });

}


// MEMULAI MUSIK
function startMusic() {

  if (!playerReady) return;

  player.seekTo(32, true);
  player.playVideo();

  document.getElementById("musicButton").textContent = "♫";
}


// MEMBUKA UNDANGAN
function openInvitation() {

  invitationOpened = true;

  document.getElementById("cover").style.display = "none";

  document.getElementById("pages").style.display = "block";

  document.getElementById("musicButton").style.display = "block";

  window.scrollTo(0, 0);

  startMusic();

}


// PLAY DAN PAUSE
function toggleMusic() {

  if (!playerReady) return;

  const button = document.getElementById("musicButton");

  if (player.getPlayerState() === YT.PlayerState.PLAYING) {

    player.pauseVideo();
    button.textContent = "▶";

  } else {

    if (player.getPlayerState() === YT.PlayerState.ENDED) {
      player.seekTo(32, true);
    }

    player.playVideo();
    button.textContent = "♫";

  }

}

</script>

</body>
</html>
