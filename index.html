
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamila & Hafizh Wedding</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eeeae5;
  font-family: Georgia, serif;
}

.cover {
  width: 100%;
  max-width: 500px;
  margin: auto;
  position: relative;
}

.cover img {
  display: block;
  width: 100%;
}

.guest {
  position: absolute;
  top: 38%;
  width: 100%;
  text-align: center;
  color: #75615c;
  font-size: clamp(14px, 4vw, 20px);
  font-style: italic;
  padding: 0 15px;
}

.open-button {
  position: absolute;
  top: 69%;
  left: 10%;
  width: 80%;
  height: 8%;
  border: 0;
  background: transparent;
  cursor: pointer;
}

#pages {
  display: none;
  max-width: 500px;
  margin: auto;
}

#pages img {
  width: 100%;
  height: auto;
  display: block;
}

#musicButton {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 10;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #806b66;
  color: white;
  font-size: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- COVER UNDANGAN -->
<section class="cover" id="cover">

  <img src="cover.png" alt="Kamila and Hafizh">

  <div class="guest" id="guest">
    Tamu Undangan
  </div>

  <button
    class="open-button"
    onclick="openInvite()"
    aria-label="Open Invitation">
  </button>

</section>

<!-- ISI UNDANGAN -->
<section id="pages">

  <img src="page-1.png" alt="Undangan halaman 1">
  <img src="page-2.png" alt="Undangan halaman 2">
  <img src="page-3.png" alt="Undangan halaman 3">

</section>

<!-- YOUTUBE PLAYER -->
<div id="youtube-player"></div>

<button id="musicButton" onclick="toggleMusic()">
  ♫
</button>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const params = new URLSearchParams(window.location.search);

const guestName =
  params.get("to") || "Tamu Undangan";

document.getElementById("guest").textContent = guestName;

let player;
let playerReady = false;
let invitationOpened = false;

function onYouTubeIframeAPIReady() {

  player = new YT.Player("youtube-player", {
    height: "0",
    width: "0",
    videoId: "joKMsvaR9gQ",

    playerVars: {
      autoplay: 0,
      controls: 0,
      start: 32,
      playsinline: 1
    },

    events: {
      onReady: function() {
        playerReady = true;

        if (invitationOpened) {
          playMusic();
        }
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.ENDED) {
          player.seekTo(32, true);
          player.playVideo();
        }
      }
    }
  });
}

function playMusic() {
  if (!playerReady) return;

  player.seekTo(32, true);
  player.playVideo();

  document.getElementById("musicButton").textContent = "♫";
}

function openInvite() {

  invitationOpened = true;

  document.getElementById("cover").style.display = "none";
  document.getElementById("pages").style.display = "block";
  document.getElementById("musicButton").style.display = "block";

  window.scrollTo(0, 0);

  playMusic();
}

function toggleMusic() {

  if (!playerReady) return;

  if (player.getPlayerState() === YT.PlayerState.PLAYING) {

    player.pauseVideo();

    document.getElementById("musicButton").textContent = "▶";

  } else {

    if (player.getPlayerState() === YT.PlayerState.ENDED) {
      player.seekTo(32, true);
    }

    player.playVideo();

    document.getElementById("musicButton").textContent = "♫";
  }
}
</script>

</body>
</html>
