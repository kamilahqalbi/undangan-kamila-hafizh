
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wedding of Kamila & Hafizh</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #eeeae5;
}
#canva {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}
#guest {
  position: fixed;
  z-index: 10;
  top: 38%;
  left: 0;
  width: 100%;
  text-align: center;
  color: #75615c;
  font: italic 17px Georgia, serif;
  pointer-events: none;
}
#music {
  position: fixed;
  z-index: 20;
  right: 20px;
  bottom: 20px;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  color: white;
  background: #806b66;
  font-size: 21px;
}
#youtube-player {
  position: fixed;
  left: -1000px;
  top: 0;
}
</style>
</head>
<body>

<iframe
  id="canva"
  src="https://lamarankamilahafizh.canva.link/"
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>

<div id="guest"></div>
<div id="youtube-player"></div>
<button id="music" onclick="toggleMusic()">♫</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const guest = new URLSearchParams(location.search).get("to");
document.getElementById("guest").textContent =
  guest ? "Kepada Yth. " + guest : "";

let player;
let ready = false;
let playing = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player("youtube-player", {
    width: "200",
    height: "200",
    videoId: "joKMsvaR9gQ",
    playerVars: {
      start: 32,
      playsinline: 1,
      loop: 1,
      playlist: "joKMsvaR9gQ"
    },
    events: {
      onReady: () => ready = true,
      onStateChange: event => {
        if (event.data === YT.PlayerState.ENDED) {
          player.seekTo(32, true);
          player.playVideo();
        }
      }
    }
  });
}

function toggleMusic() {
  if (!ready) return;

  if (playing) {
    player.pauseVideo();
    playing = false;
    document.getElementById("music").textContent = "▶";
  } else {
    player.seekTo(32, true);
    player.playVideo();
    playing = true;
    document.getElementById("music").textContent = "♫";
  }
}
</script>
</body>
</html>
